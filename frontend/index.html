<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultX - Smart Banking. Secure Future.</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #02040a;
            color: white;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
        }

        .bg-gradient-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(8, 145, 178, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 1) 0%, rgba(2, 4, 10, 1) 100%);
            z-index: 2;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(180px);
            opacity: 0.55;
            z-index: 3;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb.one {
            width: 550px;
            height: 550px;
            background: #1d4ed8;
            top: -200px;
            left: -150px;
        }

        .orb.two {
            width: 480px;
            height: 480px;
            background: #0891b2;
            bottom: -180px;
            right: -180px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, 30px) scale(1.05); }
            50% { transform: translate(20px, -20px) scale(0.98); }
            75% { transform: translate(-30px, 25px) scale(1.02); }
        }

        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: containerEnter 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes containerEnter {
            from { opacity: 0; transform: translateY(60px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 30%, #06b6d4 70%, #0891b2 100%);
            background-size: 200% 200%;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 60px rgba(59, 130, 246, 0.6);
            animation: logoGradient 4s ease infinite;
        }

        @keyframes logoGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 55px;
            letter-spacing: 2px;
        }

        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        }

        .card {
            width: 380px;
            padding: 45px 40px;
            border-radius: 30px;
            background: rgba(5, 10, 25, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(59, 130, 246, 0.18);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: cardEnter 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s backwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(40px) rotateX(15deg) scale(0.9); }
            to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        .hint {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 300;
            margin: 0;
        }

        .btn {
            padding: 18px 32px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.8px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .btn i { font-size: 1.2rem; }

        .btn:hover i { transform: translateX(5px) scale(1.1); }

        .register {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #0891b2 100%);
            color: white;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.4);
        }

        .register:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.6);
        }

        .login {
            background: rgba(15, 23, 42, 0.7);
            color: #e2e8f0;
            border: 1px solid rgba(59, 130, 246, 0.25);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        .login:hover {
            transform: translateY(-6px);
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(59, 130, 246, 0.5);
            color: white;
        }

        /* ===== RESPONSIVE - 4 BREAKPOINTS ===== */

        /* LAPTOP/DESKTOP (≥769px) */
        @media (min-width: 769px) {
            .main-container {
                padding: 0;
            }

            .logo { font-size: 5.5rem; letter-spacing: 6px; }
            .subtitle { font-size: 1.5rem; margin-bottom: 55px; letter-spacing: 2px; }
            .card { width: 380px; padding: 45px 40px; gap: 22px; }
            .hint { font-size: 14px; }
            .btn { padding: 18px 32px; font-size: 1.05rem; gap: 12px; }
            .btn i { font-size: 1.2rem; }
        }

        /* TABLET (576px - 768px) */
        @media (max-width: 768px) {
            .logo { font-size: 4rem; letter-spacing: 5px; }
            .subtitle { font-size: 1.2rem; margin-bottom: 45px; letter-spacing: 1.5px; }
            .card { width: 340px; padding: 40px 35px; gap: 20px; }
            .hint { font-size: 13px; }
            .btn { padding: 16px 28px; font-size: 1rem; gap: 10px; }
            .btn i { font-size: 1.1rem; }
        }

        /* PHONE (481px - 575px) */
        @media (max-width: 575px) {
            .logo { font-size: 3.5rem; letter-spacing: 4px; }
            .subtitle { font-size: 1.1rem; margin-bottom: 40px; letter-spacing: 1px; }
            .card { width: 100%; max-width: 320px; padding: 35px 30px; gap: 18px; border-radius: 26px; }
            .hint { font-size: 12px; }
            .btn { padding: 15px 24px; font-size: 0.95rem; gap: 8px; border-radius: 14px; }
            .btn i { font-size: 1rem; }
        }

        /* SMALL PHONE (≤480px) */
        @media (max-width: 480px) {
            .logo { font-size: 3rem; letter-spacing: 3px; margin-bottom: 5px; }
            .subtitle { font-size: 1rem; margin-bottom: 35px; letter-spacing: 0.8px; }
            .card { width: 100%; max-width: 280px; padding: 30px 25px; gap: 16px; border-radius: 24px; }
            .hint { font-size: 11px; margin-bottom: 5px; }
            .btn { padding: 14px 20px; font-size: 0.9rem; gap: 7px; border-radius: 12px; }
            .btn i { font-size: 0.95rem; }
        }

        /* Touch Device */
        @media (hover: none) and (pointer: coarse) {
            .btn:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="bg-gradient-overlay"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="main-container">
        <div class="logo">VaultX</div>
        <div class="subtitle">Smart Banking. Secure Future.</div>

        <div class="card">
            <p class="hint">New to VaultX?</p>
            <a href="register.html" style="text-decoration: none;">
                <button class="btn register">
                    <i class="fas fa-user-plus"></i>
                    Register New Account
                </button>
            </a>

            <p class="hint">Already a VaultX customer?</p>
            <a href="login.html" style="text-decoration: none;">
                <button class="btn login">
                    <i class="fas fa-sign-in-alt"></i>
                    Login to Account
                </button>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
