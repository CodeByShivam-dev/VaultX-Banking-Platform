<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultX | Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  overflow-x: hidden;
  overflow-y: auto;
  min-height: 100vh;
  background: #00040f;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  color: white;
}

/* Animated Background Grid */
.bg-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(transparent 95%, rgba(14, 165, 233, 0.1) 95%),
    linear-gradient(90deg, transparent 95%, rgba(14, 165, 233, 0.1) 95%);
  background-size: 50px 50px;
  animation: gridMove 20s linear infinite;
  z-index: 1;
}

@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(50px, 50px); }
}

/* Floating Particles */
.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(14, 165, 233, 0.6);
  border-radius: 50%;
  animation: floatParticle 15s infinite ease-in-out;
}

.particle:nth-child(1) { left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { left: 20%; animation-delay: 2s; width: 6px; height: 6px; }
.particle:nth-child(3) { left: 30%; animation-delay: 4s; }
.particle:nth-child(4) { left: 50%; animation-delay: 1s; width: 5px; height: 5px; }
.particle:nth-child(5) { left: 70%; animation-delay: 3s; }
.particle:nth-child(6) { left: 80%; animation-delay: 5s; width: 7px; height: 7px; }
.particle:nth-child(7) { left: 90%; animation-delay: 2.5s; }

@keyframes floatParticle {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  50% { transform: translateY(-100px) translateX(20px); }
}

/* Glowing Orbs with Glassmorphism */
.orbs {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 3;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.3;
  animation: orbFloat 18s infinite ease-in-out;
}

.orb-1 {
  width: 500px;
  height: 500px;
  background: #2563eb;
  top: -150px;
  left: -150px;
  animation-delay: 0s;
}

.orb-2 {
  width: 450px;
  height: 450px;
  background: #06b6d4;
  bottom: -150px;
  right: -150px;
  animation-delay: 6s;
}

.orb-3 {
  width: 350px;
  height: 350px;
  background: #3b82f6;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation-delay: 3s;
}

.orb-4 {
  width: 300px;
  height: 300px;
  background: #0ea5e9;
  top: 20%;
  right: 10%;
  animation-delay: 9s;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -50px) scale(1.1); }
  50% { transform: translate(-20px, 30px) scale(1.05); }
  75% { transform: translate(-40px, -20px) scale(1.15); }
}

/* Scan Line Effect */
.scan-line {
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 150px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(14, 165, 233, 0.15),
    rgba(14, 165, 233, 0.05),
    transparent
  );
  animation: scanMove 6s infinite linear;
  z-index: 4;
}

@keyframes scanMove {
  0% { top: -100%; }
  100% { top: 120%; }
}

/* Main Container with Glassmorphism */
.container {
  text-align: center;
  z-index: 10;
  width: 100%;
  max-width: 600px;
  padding: 50px 40px;
  background: rgba(2, 6, 23, 0.7);
  border: 1px solid rgba(14, 165, 233, 0.3);
  border-radius: 30px;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.5),
    0 0 40px rgba(14, 165, 233, 0.1),
    inset 0 0 30px rgba(14, 165, 233, 0.05);
  position: relative;
  overflow: hidden;
  animation: containerReveal 1.5s ease-out;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

@keyframes containerReveal {
  from {
    opacity: 0;
    transform: translateY(50px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    135deg,
    rgba(14, 165, 233, 0.1) 0%,
    transparent 50%,
    rgba(6, 182, 212, 0.05) 100%
  );
  z-index: -1;
}

/* Logo with Glitch Effect */
.logo {
  font-size: 90px;
  font-weight: 900;
  letter-spacing: 10px;
  position: relative;
  opacity: 0;
  animation: logoReveal 1.8s forwards;
  text-shadow: 0 0 30px rgba(14, 165, 233, 0.5);
}

@keyframes logoReveal {
  from {
    opacity: 0;
    transform: translateY(80px) scale(0.8);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.logo::before,
.logo::after {
  content: 'VAULTX';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.8;
}

.logo::before {
  color: #ff0000;
  animation: glitch1 2s infinite;
  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
}

.logo::after {
  color: #00ffff;
  animation: glitch2 2s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
}

@keyframes glitch1 {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(2px, -2px); }
  60% { transform: translate(-2px, 3px); }
  80% { transform: translate(3px, -3px); }
}

@keyframes glitch2 {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(3px, -2px); }
  40% { transform: translate(-2px, 2px); }
  60% { transform: translate(2px, -3px); }
  80% { transform: translate(-3px, 3px); }
}

.logo span {
  color: #0ea5e9;
  text-shadow: 0 0 40px rgba(14, 165, 233, 0.8);
  animation: spanGlow 2s infinite ease-in-out;
}

@keyframes spanGlow {
  0%, 100% { text-shadow: 0 0 40px rgba(14, 165, 233, 0.8); }
  50% { text-shadow: 0 0 60px rgba(14, 165, 233, 1); }
}

/* Welcome Text */
.welcome {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 15px;
  margin-bottom: 10px;
  margin-top: -10px;
  opacity: 0;
  animation: welcomeReveal 1.8s forwards;
  animation-delay: 0.8s;
  color: #0ea5e9;
  text-transform: uppercase;
}

@keyframes welcomeReveal {
  from {
    opacity: 0;
    letter-spacing: 50px;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    letter-spacing: 15px;
    transform: scale(1);
  }
}

/* Shield Icon with Pulse */
.shield {
  font-size: 80px;
  margin: 20px 0;
  color: #0ea5e9;
  animation: shieldPulse 2.5s infinite ease-in-out;
  filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.6));
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.shield:hover {
  transform: scale(1.2) rotate(10deg);
  filter: drop-shadow(0 0 40px rgba(14, 165, 233, 0.9));
}

@keyframes shieldPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

/* Username */
.username {
  font-size: 48px;
  font-weight: 800;
  opacity: 0;
  animation: userReveal 1.8s forwards;
  animation-delay: 1.8s;
  text-shadow: 0 0 30px rgba(14, 165, 233, 0.5);
  background: linear-gradient(90deg, #0ea5e9, #06b6d4, #2563eb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes userReveal {
  from {
    opacity: 0;
    transform: scale(0.6) translateY(30px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Tagline */
.tagline {
  margin-top: 15px;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 5px;
  color: #94a3b8;
  opacity: 0;
  animation: fadeIn 2.2s forwards;
  animation-delay: 2.8s;
  text-transform: uppercase;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Advanced Loader with Gradient */
.loader-box {
  width: 400px;
  margin: 35px auto;
  opacity: 0;
  animation: fadeIn 1.5s forwards;
  animation-delay: 3.5s;
  position: relative;
}

.loader {
  width: 100%;
  height: 12px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 50px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
  border: 1px solid rgba(14, 165, 233, 0.2);
}

.bar {
  height: 100%;
  width: 0;
  background: linear-gradient(
    90deg,
    #2563eb 0%,
    #0ea5e9 25%,
    #06b6d4 50%,
    #0ea5e9 75%,
    #2563eb 100%
  );
  animation: load 5s linear forwards;
  position: relative;
  background-size: 200% 100%;
}

@keyframes load {
  to {
    width: 100%;
    background-position: -200% 0;
  }
}

.bar::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.4) 50%,
    transparent 100%
  );
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.loading-text {
  margin-top: 16px;
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  letter-spacing: 4px;
  text-transform: uppercase;
  animation: textPulse 2s infinite ease-in-out;
}

@keyframes textPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* Status Widgets */
.status-widgets {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  opacity: 0;
  animation: fadeIn 2s forwards;
  animation-delay: 4s;
}

.widget {
  background: rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(14, 165, 233, 0.2);
  border-radius: 15px;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  transition: all 0.3s ease;
  cursor: pointer;
}

.widget:hover {
  background: rgba(14, 165, 233, 0.1);
  border-color: rgba(14, 165, 233, 0.4);
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(14, 165, 233, 0.2);
}

.widget i {
  color: #0ea5e9;
  font-size: 16px;
}

.widget.active {
  color: #0ea5e9;
}

.widget.active i {
  animation: iconPulse 1.5s infinite;
}

@keyframes iconPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* Corner Decorations */
.corner {
  position: absolute;
  width: 100px;
  height: 100px;
  border: 2px solid rgba(14, 165, 233, 0.3);
  z-index: 5;
}

.corner-top-left {
  top: 30px;
  left: 30px;
  border-right: none;
  border-bottom: none;
  border-radius: 20px 0 0 0;
}

.corner-top-right {
  top: 30px;
  right: 30px;
  border-left: none;
  border-bottom: none;
  border-radius: 0 20px 0 0;
}

.corner-bottom-left {
  bottom: 30px;
  left: 30px;
  border-right: none;
  border-top: none;
  border-radius: 0 0 0 20px;
}

.corner-bottom-right {
  bottom: 30px;
  right: 30px;
  border-left: none;
  border-top: none;
  border-radius: 0 0 20px 0;
}

/* Reduced Motion */

  .username,
