<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultX - Login | Secure Banking</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #02040a;
            color: white;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
        }

        .bg-gradient-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(8, 145, 178, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 1) 0%, rgba(2, 4, 10, 1) 100%);
            z-index: 2;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(180px);
            opacity: 0.55;
            z-index: 3;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb.one {
            width: 550px;
            height: 550px;
            background: #1d4ed8;
            top: -200px;
            left: -150px;
        }

        .orb.two {
            width: 480px;
            height: 480px;
            background: #0891b2;
            bottom: -180px;
            right: -180px;
            animation-delay: -5s;
        }

        .orb.three {
            width: 350px;
            height: 350px;
            background: #3b82f6;
            top: 50%;
            left: 30%;
            opacity: 0.3;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, 30px) scale(1.05); }
            50% { transform: translate(20px, -20px) scale(0.98); }
            75% { transform: translate(-30px, 25px) scale(1.02); }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 4;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            animation: particleFloat 20s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            margin: 40px 20px;
            animation: wrapperEnter 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes wrapperEnter {
            from { opacity: 0; transform: translateY(60px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6, #06b6d4, #0891b2);
            background-size: 200% 200%;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 60px rgba(59, 130, 246, 0.6);
            animation: logoGradient 4s ease infinite;
            margin-bottom: 8px;
        }

        @keyframes logoGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-icon {
            font-size: 2.2rem;
            color: #06b6d4;
            margin-left: 8px;
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 300;
        }

        .card {
            background: rgba(5, 10, 25, 0.78);
            backdrop-filter: blur(25px) saturate(180%);
            border-radius: 28px;
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-top: 1px solid rgba(59, 130, 246, 0.3);
            padding: 45px 40px;
            box-shadow: 
                0 30px 100px rgba(0, 0, 0, 0.85),
                0 0 60px rgba(37, 99, 235, 0.12),
                inset 0 0 40px rgba(59, 130, 246, 0.05);
            animation: cardEnter 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s backwards;
            position: relative;
            overflow: hidden;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(40px) rotateX(15deg) scale(0.9); }
            to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.08), transparent);
            animation: cardShine 8s ease-in-out infinite;
        }

        @keyframes cardShine {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .card-top-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            border-radius: 2px;
        }

        .phone-icon-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(8, 145, 178, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.3);
            animation: iconCirclePulse 2s ease-in-out infinite;
        }

        @keyframes iconCirclePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(37, 99, 235, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(37, 99, 235, 0.5); }
        }

        .phone-icon {
            font-size: 2.5rem;
            color: #3b82f6;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-label {
            display: block;
            color: #cbd5e1;
            font-size: 0.92rem;
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .form-label i {
            color: #3b82f6;
            margin-right: 6px;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 17px 18px 17px 48px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            font-weight: 400;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .form-control:focus {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 
                0 0 25px rgba(59, 130, 246, 0.3),
                0 0 0 3px rgba(59, 130, 246, 0.15);
            color: white;
            outline: none;
        }

        .form-control:focus + .input-icon {
            color: #3b82f6;
        }

        .form-control::placeholder {
            color: #64748b;
            font-weight: 300;
        }

        .btn-primary {
            width: 100%;
            padding: 19px 32px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8, #0891b2);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.4), 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .btn-primary i {
            font-size: 1.2rem;
            transition: all 0.4s ease;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 50%, rgba(255, 255, 255, 0.05));
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .btn-primary:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.6), 0 0 40px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:hover i {
            transform: translateX(5px) scale(1.1);
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .loading.show {
            display: block;
            animation: loadingEnter 0.5s ease;
        }

        @keyframes loadingEnter {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .links-section {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(59, 130, 246, 0.15);
        }

        .links {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .links a:hover {
            color: #60a5fa;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            padding: 12px 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
        }

        .secure-badge i {
            color: #10b981;
            font-size: 1rem;
        }

        .secure-badge span {
            color: #6ee7b7;
            font-size: 0.85rem;
            font-weight: 400;
        }

        .back-section {
            text-align: center;
            margin-top: 25px;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .back-link i {
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #cbd5e1;
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .back-link:hover i {
            transform: translateX(-5px);
        }

        /* ===== RESPONSIVE DESIGN - PROFESSIONAL ===== */
        
        /* Desktop (≥769px) */
        @media (min-width: 769px) {
            .main-wrapper {
                max-width: 450px;
                padding: 20px;
                margin: 40px 20px;
            }
            
            .logo {
                font-size: 4rem;
                letter-spacing: 5px;
            }
            
            .logo-icon {
                font-size: 2.2rem;
            }
            
            .page-title {
                font-size: 1.6rem;
            }
            
            .card {
                padding: 45px 40px;
            }
        }

        /* Tablet/Laptop (576px - 768px) */
        @media (max-width: 768px) {
            .main-wrapper {
                max-width: 420px;
                padding: 15px;
                margin: 30px 15px;
            }
            
            .logo {
                font-size: 3rem;
                letter-spacing: 4px;
            }
            
            .logo-icon {
                font-size: 2rem;
                margin-left: 6px;
            }
            
            .page-title {
                font-size: 1.3rem;
            }
            
            .page-subtitle {
                font-size: 0.9rem;
            }
            
            .card {
                padding: 35px 30px;
            }
            
            .card-top-line {
                width: 60px;
            }
            
            .phone-icon-circle {
                width: 75px;
                height: 75px;
                margin-bottom: 20px;
            }
            
            .phone-icon {
                font-size: 2.2rem;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            .form-label {
                font-size: 0.88rem;
                margin-bottom: 8px;
            }
            
            .form-label i {
                font-size: 0.85rem;
            }
            
            .form-control {
                padding: 15px 16px 15px 44px;
                font-size: 0.95rem;
            }
            
            .input-icon {
                left: 14px;
                font-size: 0.9rem;
            }
            
            .btn-primary {
                padding: 17px 28px;
                font-size: 1rem;
                gap: 10px;
            }
            
            .btn-primary i {
                font-size: 1.1rem;
            }
            
            .loading {
                padding: 12px;
                font-size: 0.85rem;
            }
            
            .spinner {
                width: 16px;
                height: 16px;
                margin-right: 8px;
            }
            
            .links-section {
                margin-top: 20px;
                padding-top: 20px;
            }
            
            .links {
                font-size: 0.85rem;
            }
            
            .secure-badge {
                padding: 10px 16px;
                margin-top: 20px;
            }
            
            .secure-badge i {
                font-size: 0.9rem;
            }
            
            .secure-badge span {
                font-size: 0.8rem;
            }
            
            .back-section {
                margin-top: 20px;
            }
            
            .back-link {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .back-link i {
                font-size: 0.9rem;
            }
            
            .orb.one, .orb.two {
                width: 400px;
                height: 400px;
            }
            
            .orb.three {
                width: 300px;
                height: 300px;
            }
        }

        /* Mobile Small (≤575px) */
        @media (max-width: 575px) {
            .main-wrapper {
                max-width: 100%;
                padding: 12px;
                margin: 25px 12px;
            }
            
            .logo {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            
            .logo-icon {
                font-size: 1.8rem;
                margin-left: 6px;
            }
            
            .page-title {
                font-size: 1.1rem;
                margin-bottom: 6px;
            }
            
            .page-subtitle {
                font-size: 0.85rem;
            }
            
            .card {
                padding: 30px 25px;
                border-radius: 24px;
            }
            
            .card-top-line {
                width: 50px;
                height: 3px;
            }
            
            .phone-icon-circle {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }
            
            .phone-icon {
                font-size: 2rem;
            }
            
            .form-group {
                margin-bottom: 18px;
            }
            
            .form-label {
                font-size: 0.85rem;
                margin-bottom: 8px;
            }
            
            .form-control {
                padding: 14px 14px 14px 42px;
                font-size: 0.9rem;
                border-radius: 14px;
            }
            
            .input-icon {
                left: 12px;
                font-size: 0.85rem;
            }
            
            .btn-primary {
                padding: 16px 24px;
                font-size: 0.95rem;
                gap: 8px;
                border-radius: 14px;
            }
            
            .btn-primary i {
                font-size: 1rem;
            }
            
            .loading {
                padding: 10px;
                font-size: 0.8rem;
                margin-top: 16px;
                border-radius: 10px;
            }
            
            .spinner {
                width: 14px;
                height: 14px;
                margin-right: 6px;
            }
            
            .links-section {
                margin-top: 18px;
                padding-top: 18px;
            }
            
            .links {
                font-size: 0.8rem;
            }
            
            .links a {
                font-size: 0.8rem;
            }
            
            .secure-badge {
                padding: 8px 14px;
                margin-top: 18px;
                border-radius: 10px;
            }
            
            .secure-badge i {
                font-size: 0.85rem;
            }
            
            .secure-badge span {
                font-size: 0.75rem;
            }
            
            .back-section {
                margin-top: 18px;
            }
            
            .back-link {
                padding: 10px 18px;
                font-size: 0.85rem;
                border-radius: 10px;
            }
            
            .back-link i {
                font-size: 0.85rem;
            }
            
            .orb {
                filter: blur(140px);
            }
            
            .orb.one, .orb.two {
                width: 320px;
                height: 320px;
            }
            
            .orb.three {
                width: 250px;
                height: 250px;
            }
        }

        /* Mobile Extra Small (≤480px) */
        @media (max-width: 480px) {
            .main-wrapper {
                margin: 20px 10px;
                padding: 10px;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .logo-icon {
                font-size: 1.6rem;
            }
            
            .page-title {
                font-size: 1rem;
            }
            
            .card {
                padding: 28px 22px;
            }
            
            .phone-icon-circle {
                width: 65px;
                height: 65px;
            }
            
            .phone-icon {
                font-size: 1.8rem;
            }
            
            .form-control {
                padding: 13px 13px 13px 40px;
                font-size: 0.85rem;
            }
        }

        /* Ultra Mobile (≤375px) */
        @media (max-width: 375px) {
            .main-wrapper {
                margin: 15px 8px;
                padding: 8px;
            }
            
            .logo {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
            
            .logo-icon {
                font-size: 1.4rem;
            }
            
            .page-title {
                font-size: 0.9rem;
            }
            
            .page-subtitle {
                font-size: 0.75rem;
            }
            
            .card {
                padding: 24px 18px;
                border-radius: 20px;
            }
            
            .phone-icon-circle {
                width: 60px;
                height: 60px;
                margin-bottom: 18px;
            }
            
            .phone-icon {
                font-size: 1.6rem;
            }
            
            .form-label {
                font-size: 0.75rem;
            }
            
            .form-control {
                padding: 12px 12px 12px 38px;
                font-size: 0.8rem;
            }
            
            .btn-primary, .back-link {
                padding: 14px 16px;
                font-size: 0.8rem;
            }
        }

        /* Touch Device Optimization */
        @media (hover: none) and (pointer: coarse) {
            .btn-primary:hover,
            .back-link:hover,
            .links a:hover {
                transform: none;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .orb,
            .particle,
            .logo,
            .logo-icon,
            .phone-icon-circle,
            .card,
            .spinner {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="bg-gradient-overlay"></div>
    
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    
    <div class="particles" id="particles"></div>

    <div class="main-wrapper">
        <div class="logo-section">
            <div class="logo">
                VaultX
                <i class="fas fa-shield-halved logo-icon"></i>
            </div>
            <div class="page-title">Login via OTP</div>
            <div class="page-subtitle">Enter your phone number to login</div>
        </div>

        <div class="card">
            <div class="card-top-line"></div>

            <div class="phone-icon-circle">
                <i class="fas fa-mobile-screen-button phone-icon"></i>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-phone"></i> Phone Number
                    </label>
                    <div class="input-wrapper">
                        <input type="tel" class="form-control" id="phone" placeholder="+91 XXXXX XXXXX" pattern="[0-9]{10}" required inputmode="numeric">
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-paper-plane"></i>
                    Send OTP
                </button>

                <div id="loginMessage" style="display:none; text-align:center; margin-top:10px; font-weight:600; color:#ef4444;"></div>

                <div class="loading" id="loading">
                    <span class="spinner"></span>
                    <span id="loadingText">Sending OTP to your phone...</span>
                </div>
            </form>

            <div class="links-section">
                <div class="links">
                    Don't have account? <a href="register.html">Register Now</a>
                </div>
            </div>

            <div class="secure-badge">
                <i class="fas fa-shield-alt"></i>
                <span>OTP encrypted with 256-bit SSL</span>
            </div>

            <div class="back-section">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = window.innerWidth < 576 ? 12 : 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // Mouse movement effect (disabled on mobile)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const orbs = document.querySelectorAll('.orb');
                const mouseX = e.clientX / window.innerWidth - 0.5;
                const mouseY = e.clientY / window.innerHeight - 0.5;
                orbs.forEach((orb, i) => {
                    const speed = (i + 1) * 15;
                    orb.style.transform = `translate(${mouseX * speed}px, ${mouseY * speed}px)`;
                });
            });
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            const btn = document.querySelector('.btn-primary');

            if (!phone || phone.length !== 10) {
                alert('Please enter a valid 10-digit phone number');
                return;
            }

            loading.classList.add('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending OTP...';

            fetch("https://vaultx-banking-platform-1.onrender.com/api/auth/send-otp", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone
                })
            })
            .then(res => res.text())
            .then(data => {
                if(data === "User not found"){
                    loading.classList.remove('show');
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
                    btn.disabled = false;

                    const msg = document.getElementById("loginMessage");
                    msg.style.display = "block";
                    msg.innerHTML = 'Phone number not registered. <a href="register.html" style="color:#3b82f6">Register Now</a>';
                    return;
                }

                loadingText.innerText = 'OTP sent successfully!';

                setTimeout(() => {
                    localStorage.setItem('vaultx_phone', phone);
                    loading.classList.remove('show');
                    btn.innerHTML = '<i class="fas fa-check"></i> OTP Sent!';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';

                    setTimeout(() => {
                        window.location.href = 'otp.html?type=login';
                    }, 500);
                }, 1200);
            })
            .catch(err => {
                alert('Failed to send OTP. Please try again.');
                loading.classList.remove('show');
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
                btn.disabled = false;
            });
        });

        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, ''); // Only numbers
                if (this.validity.valid) {
                    this.style.borderColor = 'rgba(16, 185, 129, 0.6)';
                } else {
                    this.style.borderColor = '';
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
